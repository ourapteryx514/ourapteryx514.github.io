---
layout: default
---

<article class="blog-post-page fa-page" dir="rtl" lang="fa">

  <p style="font-size:14px; color:#888; margin-bottom:8px;">
    {{ page.date | date: "%Y/%m/%d" }}
  </p>

  <h1 style="margin-top:0; margin-bottom:25px;">
    {{ page.title }}
  </h1>

  <div class="blog-post-body">
    {{ content }}
  </div>

  <hr style="margin:50px 0 30px; border:0; border-top:1px solid #eee;">

  <p>
    <a href="{{ '/fa/blog/' | relative_url }}">← بازگشت به وبلاگ</a>
  </p>

</article>
