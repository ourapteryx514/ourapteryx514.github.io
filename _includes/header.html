<header class="site-header" role="banner">

  <div class="wrapper bilingual-header-wrapper">

    {% if page.url contains '/fa/' %}

    <!-- PERSIAN HEADER -->
    <div class="custom-header persian-header" dir="rtl">

      <span class="header-brand persian-brand">
        امید کوکبی
      </span>

      <button class="menu-toggle"
              type="button"
              aria-label="باز کردن منو"
              aria-controls="persian-navigation"
              aria-expanded="false">
        ☰
      </button>

      <nav id="persian-navigation"
           class="custom-nav persian-nav">

        <a href="{{ '/fa/' | relative_url }}">خانه</a>
        <a href="{{ '/fa/about/' | relative_url }}">درباره من</a>
        <a href="{{ '/fa/research/' | relative_url }}">پژوهش</a>
        <a href="{{ '/fa/projects/' | relative_url }}">پروژه‌ها</a>
        <a href="{{ '/fa/blog/' | relative_url }}">وبلاگ</a>
        <a href="{{ '/fa/contact/' | relative_url }}">تماس</a>

        {% assign english_url = page.url | remove_first: '/fa' %}

        <a class="language-switch"
           href="{{ english_url | relative_url }}">
          EN
        </a>

      </nav>

    </div>


    {% else %}

    <!-- ENGLISH HEADER -->
    <div class="custom-header english-header">

      <span class="header-brand">
        OMID KOKABEE
      </span>

      <button class="menu-toggle"
              type="button"
              aria-label="Open menu"
              aria-controls="english-navigation"
              aria-expanded="false">
        ☰
      </button>

      <nav id="english-navigation"
           class="custom-nav">

        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>

        <a class="language-switch"
           href="{{ '/fa' | append: page.url | relative_url }}">
          فارسی
        </a>

      </nav>

    </div>

    {% endif %}

  </div>

</header>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const button = document.querySelector(".menu-toggle");
  const nav = document.querySelector(".custom-nav");

  if (button && nav) {

    button.addEventListener("click", function () {

      nav.classList.toggle("menu-open");

      const opened = nav.classList.contains("menu-open");

      button.setAttribute("aria-expanded", opened);

      button.textContent = opened ? "✕" : "☰";
    });

  }

});
</script>
