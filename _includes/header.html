<header class="site-header" role="banner">
  <div class="wrapper">

    {% if page.url contains '/fa/' %}

      <nav class="custom-nav persian-nav" dir="rtl">

        <a href="{{ '/fa/' | relative_url }}">خانه</a>
        <a href="{{ '/fa/about/' | relative_url }}">درباره من</a>
        <a href="{{ '/fa/research/' | relative_url }}">پژوهش</a>
        <a href="{{ '/fa/projects/' | relative_url }}">پروژه‌ها</a>
        <a href="{{ '/fa/blog/' | relative_url }}">وبلاگ</a>
        <a href="{{ '/fa/contact/' | relative_url }}">تماس</a>

        {% assign english_url = page.url | remove_first: '/fa' %}
        <a class="language-switch" href="{{ english_url | relative_url }}">EN</a>

      </nav>

    {% else %}

      <nav class="custom-nav">

        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>

        <a class="language-switch"
           href="{{ '/fa' | append: page.url | relative_url }}">
          فارسی
        </a>

      </nav>

    {% endif %}

  </div>
</header>
