<header class="site-header" role="banner">

  <div class="wrapper" style="max-width:1250px;">

    {% if page.url contains '/fa/' %}

    <!-- Persian header -->
    <div style="
      width:100%;
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:nowrap;
      gap:30px;
    ">

      <!-- Persian navigation on LEFT -->
      <nav dir="rtl" style="
        display:flex;
        align-items:center;
        gap:22px;
        white-space:nowrap;
        font-family:Tahoma,Arial,sans-serif;
      ">

        <a href="{{ '/fa/' | relative_url }}">خانه</a>
        <a href="{{ '/fa/about/' | relative_url }}">درباره من</a>
        <a href="{{ '/fa/research/' | relative_url }}">پژوهش</a>
        <a href="{{ '/fa/projects/' | relative_url }}">پروژه‌ها</a>
        <a href="{{ '/fa/blog/' | relative_url }}">وبلاگ</a>
        <a href="{{ '/fa/contact/' | relative_url }}">تماس</a>

        {% assign english_url = page.url | remove_first: '/fa' %}

        <a href="{{ english_url | relative_url }}"
           style="
             font-weight:600;
             padding-right:18px;
             border-right:1px solid #ddd;
           ">
          EN
        </a>

      </nav>

      <!-- Persian name on RIGHT — NOT a hyperlink -->
      <span style="
        font-family:Tahoma,Arial,sans-serif;
        font-size:32px;
        font-weight:300;
        line-height:1;
        white-space:nowrap;
        direction:rtl;
      ">
        امید کوکبی
      </span>

    </div>


    {% else %}

    <!-- English header -->
    <div style="
      width:100%;
      min-height:82px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:nowrap;
      gap:30px;
    ">

      <!-- English name on LEFT — NOT a hyperlink -->
      <span style="
        font-size:32px;
        font-weight:300;
        line-height:1;
        white-space:nowrap;
      ">
        OMID KOKABEE
      </span>

      <!-- English navigation on RIGHT -->
      <nav style="
        display:flex;
        align-items:center;
        gap:22px;
        white-space:nowrap;
      ">

        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>

        <a href="{{ '/fa' | append: page.url | relative_url }}"
           style="
             font-weight:600;
             padding-left:18px;
             border-left:1px solid #ddd;
           ">
          فارسی
        </a>

      </nav>

    </div>

    {% endif %}

  </div>

</header>
